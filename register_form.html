    <div class="container" style="padding: 3rem 2rem;">
        <h1 style="text-align: center; color: #2563EB; margin-bottom: 2rem;">🛍️ Merchandise Store</h1>
        <p style="text-align: center; margin-bottom: 3rem; color: #6B7684;">45+ Premium Tech Products & <strong>8 FREE

    <!-- Cart Button -->
    <button onclick="window.cart.toggle()"
        style="position: fixed; bottom: 2rem; right: 2rem; width: 60px; height: 60px; background: linear-gradient(135deg, #2563EB, #1D4ED8); color: white; border: none; border-radius: 50%; font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); z-index: 1000;">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-badge"

    </button>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar"
        style="position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: white; box-shadow: -5px 0 25px rgba(0,0,0,0.1); transition: right 0.3s; z-index: 1001; display: flex; flex-direction: column;">
        <div
            style="padding: 1.5rem; border-bottom: 1px solid #E8ECEF; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; color: #1A202C;"><i class="fas fa-shopping-cart"></i> Your Cart</h2>
            <button onclick="window.cart.toggle()"
                style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6B7684;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="cart-items" style="flex: 1; overflow-y: auto; padding: 1.5rem;"></div>
        <div style="padding: 1.5rem; border-top: 1px solid #E8ECEF;">
            <div
                style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.25rem; font-weight: 700;">
                <span>Total:</span>
                <span id="cart-total">£0.00</span>
            </div>
            <button onclick="window.cart.checkout()"
                style="width: 100%; padding: 1rem; background: linear-gradient(135deg, #2563EB, #1D4ED8); color: white; border: none; border-radius: 0.75rem; font-weight: 700; font-size: 1.125rem; cursor: pointer;">
                <i class="fas fa-credit-card"></i> Checkout
            </button>
        </div>
    </div>

    <!-- Email Modal -->
    <div id="email-modal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1002; align-items: center; justify-content: center;">
        <div
            style="background: white; padding: 2rem; border-radius: 1rem; max-width: 400px; width: 90%; box-shadow: 0 20px 25px rgba(0,0,0,0.3);">
            <h2 style="margin: 0 0 1rem; color: #1A202C; text-align: center;">📧 Claim Your FREE Offer!</h2>
            <p style="color: #6B7684; text-align: center; margin-bottom: 1.5rem;">Enter your email to receive your free
                merchandise</p>
            <input type="email" id="claim-email" placeholder="your.email@example.com"
                style="width: 100%; padding: 0.75rem; border: 2px solid #E8ECEF; border-radius: 0.5rem; font-size: 1rem; margin-bottom: 1rem;">
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="window.cart.cancelEmail()"
                    style="flex: 1; padding: 0.75rem; background: #F4F6F8; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; color: #6B7684;">Cancel</button>
                <button onclick="window.cart.submitEmail()"
                    style="flex: 1; padding: 0.75rem; background: linear-gradient(135deg, #10B981, #059669); color: white; border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer;">Claim
                    Now!</button>
            </div>
        </div>
    </div>

    <script>
        // Simple working cart system
        window.cart = {
            items: [],
            pendingClaim: null,

            add: function (product, qty) {
                // If FREE item, ask for email first
                if (product.free) {
                    this.pendingClaim = { product, qty };
                    document.getElementById('email-modal').style.display = 'flex';
                    document.getElementById('claim-email').value = '';
                    document.getElementById('claim-email').focus();
                    return;
                }

                // For paid items, add directly
                const existing = this.items.find(i => i.name === product.name);
                if (existing) {
                    existing.qty += qty;
                } else {
                    this.items.push({ ...product, qty: qty });
                }
                this.update();
                this.showToast(product, qty);
            },

            submitEmail: function () {
                const email = document.getElementById('claim-email').value.trim();
                if (!email || !email.includes('@')) {
                    alert('Please enter a valid email address');
                    return;
                }

                // Add the pending item to cart
                const { product, qty } = this.pendingClaim;
                const existing = this.items.find(i => i.name === product.name);
                if (existing) {
                    existing.qty += qty;
                } else {
                    this.items.push({ ...product, qty: qty });
                }

                // Close modal and show confirmation
                document.getElementById('email-modal').style.display = 'none';
                this.update();
                this.showToast(product, qty);

                // Show success message
                setTimeout(() => {
                    alert(`✅ Success!\n\nYour FREE ${product.name} has been claimed!\n\nWe'll send details to: ${email}`);
                }, 500);

                this.pendingClaim = null;
            },

            cancelEmail: function () {
                document.getElementById('email-modal').style.display = 'none';
                this.pendingClaim = null;
            },

            remove: function (index) {
                this.items.splice(index, 1);
                this.update();
            },

            update: function () {
                const badge = document.getElementById('cart-badge');
                const itemsDiv = document.getElementById('cart-items');
                const total = document.getElementById('cart-total');

                const count = this.items.reduce((sum, i) => sum + i.qty, 0);
                const price = this.items.reduce((sum, i) => sum + (i.price * i.qty), 0);

                badge.textContent = count;
                total.textContent = '£' + price.toFixed(2);

                if (this.items.length === 0) {
                    itemsDiv.innerHTML = '<div style="text-align: center; padding: 3rem; color: #6B7684;"><i class="fas fa-shopping-cart" style="font-size: 4rem; color: #BFDBFE; margin-bottom: 1rem;"></i><p>Your cart is empty</p></div>';
                } else {
                    itemsDiv.innerHTML = this.items.map((item, i) => `
                    <div style="display: flex; gap: 1rem; padding: 1rem; background: #F4F6F8; border-radius: 0.75rem; margin-bottom: 1rem;">
                        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #DBEAFE, #BFDBFE); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 2rem;">${item.icon}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 700; color: #1A202C;">${item.name}</div>
                            <div style="color: ${item.free ? '#10B981' : '#2563EB'}; font-weight: 600;">${item.free ? 'FREE' : '£' + item.price.toFixed(2)}</div>
                            <div style="color: #6B7684; font-size: 0.875rem;">Qty: ${item.qty}</div>
                        </div>
                        <button onclick="window.cart.remove(${i})" style="background: none; border: none; color: #EF4444; cursor: pointer; font-size: 1.25rem;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `).join('');
                }
            },

            toggle: function () {
                const sidebar = document.getElementById('cart-sidebar');
                sidebar.style.right = sidebar.style.right === '0px' ? '-400px' : '0px';
            },

            checkout: function () {
                if (this.items.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }
                const total = this.items.reduce((sum, i) => sum + (i.price * i.qty), 0);
                const free = this.items.filter(i => i.free).length;
                let msg = 'Thank you for your order!\n\n';
                if (free > 0) msg += `Free Items: ${free}\n`;
                if (total > 0) msg += `Total: £${total.toFixed(2)}\n`;
                else msg += 'All items are FREE!\n';
                msg += '\nYour merchandise will be shipped soon!';
                alert(msg);
                this.items = [];
                this.update();
                this.toggle();
            },

            showToast: function (product, qty) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.style.cssText = 'position: fixed; bottom: 100px; right: 2rem; background: white; padding: 1rem 1.5rem; border-radius: 1rem; box-shadow: 0 20px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 1rem; z-index: 1002; animation: slideUp 0.5s; border-left: 4px solid ' + (product.free ? '#10B981' : '#2563EB');
                toast.innerHTML = `
                <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #DBEAFE, #BFDBFE); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 2rem;">${product.icon}</div>
                <div>
                    <div style="font-weight: 700; color: #1A202C;">${product.free ? '🎉 You Claimed!' : '✅ Added to Cart'}</div>
                    <div style="color: #6B7684; font-size: 0.875rem;">${qty}x ${product.name}</div>
                </div>
            `;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        };

        // Products
        const products = [
            // 🎁 FREE Claim Offers (Email Required)
            { name: 'Exclusive Operator Skin', icon: '🥷', price: 0, desc: 'Ltd Edition In-Game Skin', free: true },
            { name: '1000 XP Boost Token', icon: '⚡', price: 0, desc: 'Double XP for 24hrs', free: true },
            { name: 'Digital Artbook', icon: '🎨', price: 0, desc: 'Concept Art PDF', free: true },
            { name: 'Pro Config Guide', icon: '⚙️', price: 0, desc: 'Settings from Pros', free: true },

            { name: 'Stream Overlay Pack', icon: '🎭', price: 0, desc: 'Twitch/YouTube Assets', free: true },
            { name: 'Discord Badge', icon: '📛', price: 0, desc: 'Verified Gamer Badge', free: true },
            { name: 'Beta Access Key', icon: '🔑', price: 0, desc: 'Early Game Access', free: true },

            // Consoles
            { name: 'PlayStation 5', icon: '🎮', price: 479.99, desc: 'Next-gen gaming' },
            { name: 'Xbox Series X', icon: '❎', price: 449.99, desc: 'Power your dreams' },
            { name: 'Xbox Series S', icon: '📦', price: 249.99, desc: 'Digital performance' },

            { name: 'Switch OLED', icon: '📟', price: 309.99, desc: 'Vibrant 7-inch screen' },

            // Video Cameras
            { name: 'Sony Alpha a7 IV', icon: '📸', price: 2499.99, desc: 'Full-frame hybrid' },
            { name: 'Canon EOS R6', icon: '📷', price: 2299.99, desc: 'High-speed mirrorless' },
            { name: 'Panasonic GH5 II', icon: '🎥', price: 1499.99, desc: 'Cinema 4K recording' },
            { name: 'Sony ZV-E10', icon: '📹', price: 699.99, desc: 'Vlog camera' },
            { name: 'GoPro HERO12', icon: '🧗', price: 399.99, desc: 'Action camera' },

            // MacBooks
            { name: 'MacBook Air M2', icon: '💻', price: 999.99, desc: 'Supercharged by M2' },
            { name: 'MacBook Pro 13 M2', icon: '💻', price: 1299.99, desc: 'Pro power' },

            { name: 'MacBook Pro 16 M3', icon: '💻', price: 2499.99, desc: 'Max performance' },
            { name: 'Mac Studio', icon: '🖥️', price: 1999.99, desc: 'Creative powerhouse' },

            // iPads
            { name: 'iPad Pro 12.9"', icon: '📱', price: 1099.99, desc: 'M2 chip, XDR display' },
            { name: 'iPad Pro 11"', icon: '📱', price: 799.99, desc: 'Ultimate iPad experience' },
            { name: 'iPad Air 5', icon: '📱', price: 599.99, desc: 'Light. Bright. Full of might.' },
            { name: 'iPad 10th Gen', icon: '📱', price: 449.99, desc: 'Colorful all-screen design' },
            { name: 'iPad Mini 6', icon: '📱', price: 499.99, desc: 'Mega power. Mini size.' },

            // Windows Laptops
            { name: 'Dell XPS 13', icon: '💻', price: 999.99, desc: 'Thin & light' },
            { name: 'Dell XPS 15', icon: '💻', price: 1499.99, desc: 'Creator edition' },
            { name: 'HP Spectre x360', icon: '💻', price: 1299.99, desc: 'Convertible design' },
            { name: 'Surface Laptop 5', icon: '💻', price: 999.99, desc: 'Sleek and unified' },
            { name: 'ThinkPad X1 Carbon', icon: '💼', price: 1699.99, desc: 'Business flagship' },

            // Gaming Laptops
            { name: 'ROG Zephyrus G14', icon: '🚀', price: 1499.99, desc: 'Compact gaming beast' },
            { name: 'TUF Gaming A15', icon: '🛡️', price: 999.99, desc: 'Durable performance' },
            { name: 'Acer Swift 3', icon: '💻', price: 699.99, desc: 'Everyday productivity' },
            { name: 'Predator Helios', icon: '🦖', price: 1299.99, desc: 'Extreme gaming' },
            { name: 'MSI GS66 Stealth', icon: '🥷', price: 1799.99, desc: 'Sharp and sleek' },

            // Student/Work Laptops
            { name: 'Lenovo IdeaPad 3', icon: '📓', price: 499.99, desc: 'Daily driver' },
            { name: 'HP Pavilion 15', icon: '💻', price: 599.99, desc: 'Reliable all-rounder' },
            { name: 'Galaxy Book Pro', icon: '🌌', price: 1099.99, desc: 'AMOLED screen' },
            { name: 'Pixelbook Go', icon: '🔍', price: 649.99, desc: 'Built for cloud' },
            { name: 'LG Gram 17', icon: '⚖️', price: 1699.99, desc: 'Ultra-lightweight 17"' },

            // 2-in-1
            { name: 'Surface Pro 9', icon: '🖊️', price: 999.99, desc: 'Tablet versatility' },
            { name: 'Lenovo Yoga 9i', icon: '🧘', price: 1399.99, desc: 'Rotating soundbar' },
            { name: 'HP Elite x2', icon: '💼', price: 1599.99, desc: 'Detachable business' },
            { name: 'Inspiron 14 2-in-1', icon: '🔄', price: 749.99, desc: 'Flexible mode' },
            { name: 'Chromebook Spin', icon: '🌀', price: 599.99, desc: '360-degree hinge' }
        ];

        // Render products
        const grid = document.getElementById('products');
        products.forEach((p, i) => {
            const card = document.createElement('div');
            card.style.cssText = 'background: white; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 10px 15px rgba(30,64,175,0.1); border: 1px solid rgba(59,130,246,0.1); transition: transform 0.3s;';
            card.onmouseenter = () => card.style.transform = 'translateY(-10px)';
            card.onmouseleave = () => card.style.transform = 'translateY(0)';

            card.innerHTML = `
            <div style="height: 200px; background: linear-gradient(135deg, #DBEAFE, #BFDBFE); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative;">
                ${p.icon}
                ${p.free ? '<div style="position: absolute; top: 10px; right: 10px; background: #10B981; color: white; padding: 0.375rem 0.75rem; border-radius: 1rem; font-weight: 700; font-size: 0.75rem;">FREE</div>' : ''}
            </div>
            <div style="padding: 1.25rem;">
                <div style="font-size: 1.125rem; font-weight: 700; color: #1A202C; margin-bottom: 0.5rem;">${p.name}</div>
                <div style="color: #6B7684; font-size: 0.8125rem; margin-bottom: 0.75rem; min-height: 2.5rem;">${p.desc}</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: ${p.free ? '#10B981' : '#2563EB'}; margin-bottom: 0.75rem;">
                    ${p.free ? 'FREE for Members!' : '£' + p.price.toFixed(2)}
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 0.375rem; background: #F4F6F8; border-radius: 0.5rem; padding: 0.25rem;">
                        <button onclick="this.nextElementSibling.textContent = Math.max(1, parseInt(this.nextElementSibling.textContent) - 1)" style="width: 28px; height: 28px; border: none; background: white; border-radius: 0.375rem; cursor: pointer; font-weight: 700; color: #2563EB;">-</button>
                        <span style="width: 32px; text-align: center; font-weight: 600; color: #1A202C; font-size: 0.875rem;">1</span>
                        <button onclick="this.previousElementSibling.textContent = parseInt(this.previousElementSibling.textContent) + 1" style="width: 28px; height: 28px; border: none; background: white; border-radius: 0.375rem; cursor: pointer; font-weight: 700; color: #2563EB;">+</button>
                    </div>
                    <button onclick="const qty = parseInt(this.previousElementSibling.querySelector('span').textContent); window.cart.add(products[${i}], qty); this.previousElementSibling.querySelector('span').textContent = '1';" style="flex: 1; padding: 0.625rem 1rem; background: linear-gradient(135deg, ${p.free ? '#10B981, #059669' : '#2563EB, #1D4ED8'}); color: white; border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer; font-size: 0.875rem;">
                        <i class="fas fa-${p.free ? 'gift' : 'cart-plus'}"></i> ${p.free ? 'Claim' : 'Add'}
                    </button>
                </div>
            </div>
        `;
            grid.appendChild(card);
        });

        // Animation
        const style = document.createElement('style');
        style.textContent = '@keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }';
        document.head.appendChild(style);

        console.log('✅ Cart system loaded! Type: window.cart');
    </script>
</body>
